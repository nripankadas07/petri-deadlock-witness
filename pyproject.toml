[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "petri-deadlock-witness"
version = "0.1.0"
description = "Explore ordinary weighted place-transition nets and return a shortest unexpected deadlock firing sequence, explored-state count and explicit cutoff/unknown status."
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = []
[project.scripts]
petri-deadlock-witness = "petri_deadlock_witness:main"
[tool.setuptools]
py-modules = ["petri_deadlock_witness"]
